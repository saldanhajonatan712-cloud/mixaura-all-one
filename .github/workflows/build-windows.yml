name: Build Mix Aura Windows x64 VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mix-aura-windows-vst3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Windows build tools
        shell: pwsh
        run: |
          if ($env:VSCMD_ARG_TGT_ARCH -ne "x64") {
            throw "MSVC target architecture is not x64: $env:VSCMD_ARG_TGT_ARCH"
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "MSVC compiler cl.exe is unavailable" }
          if (-not (Get-Command cmake.exe -ErrorAction SilentlyContinue)) { throw "CMake is unavailable" }
          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) { throw "Ninja is unavailable" }
          cmake --version
          ninja --version
          cl.exe 2>&1 | Select-Object -First 4

      - name: Configure Release x64
        shell: pwsh
        run: |
          cmake -E rm -rf build
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target MixAura_VST3 --parallel

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path build -Directory -Filter "*.vst3" -Recurse |
            Where-Object { $_.Name -eq "MIX AURA ALL-IN-ONE.vst3" })
          if ($bundles.Count -ne 1) { throw "Expected exactly one Mix Aura VST3 bundle for pluginval; found $($bundles.Count)" }

          $pluginvalZip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $pluginvalUrl = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $pluginvalUrl -OutFile $pluginvalZip
          $expectedSha256 = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          $actualSha256 = (Get-FileHash -Path $pluginvalZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "pluginval v1.0.4 checksum mismatch: $actualSha256"
          }

          $pluginvalDir = Join-Path $env:RUNNER_TEMP "pluginval"
          Expand-Archive -Path $pluginvalZip -DestinationPath $pluginvalDir -Force
          $pluginvalExe = Join-Path $pluginvalDir "pluginval.exe"
          if (-not (Test-Path $pluginvalExe -PathType Leaf)) { throw "pluginval.exe is missing from the official release archive" }
          $pluginvalStdout = Join-Path $env:RUNNER_TEMP "pluginval.stdout.log"
          $pluginvalStderr = Join-Path $env:RUNNER_TEMP "pluginval.stderr.log"
          $pluginvalArguments = "--strictness-level 5 `"$($bundles[0].FullName)`""
          $pluginvalProcess = Start-Process -FilePath $pluginvalExe -ArgumentList $pluginvalArguments `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $pluginvalStdout -RedirectStandardError $pluginvalStderr
          if (Test-Path $pluginvalStdout) { Get-Content $pluginvalStdout }
          if (Test-Path $pluginvalStderr) { Get-Content $pluginvalStderr }
          if ($pluginvalProcess.ExitCode -ne 0) {
            throw "pluginval failed with exit code $($pluginvalProcess.ExitCode)"
          }

      - name: Validate and package VST3
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path build -Directory -Filter "*.vst3" -Recurse |
            Where-Object { $_.Name -eq "MIX AURA ALL-IN-ONE.vst3" })
          if ($bundles.Count -ne 1) { throw "Expected exactly one Mix Aura VST3 bundle; found $($bundles.Count)" }
          $bundle = $bundles[0]
          $contents = Join-Path $bundle.FullName "Contents"
          $resources = Join-Path $contents "Resources"
          $windowsX64 = Join-Path $contents "x86_64-win"
          foreach ($requiredPath in @($contents, $resources, $windowsX64)) {
            if (-not (Test-Path $requiredPath -PathType Container)) {
              throw "VST3 bundle is incomplete; required directory missing: $requiredPath"
            }
          }
          $modules = @(Get-ChildItem -Path $windowsX64 -Recurse -File |
            Where-Object { $_.Extension -in @(".dll", ".vst3") })
          if ($modules.Count -ne 1) { throw "Expected exactly one Windows x64 module in Contents/x86_64-win; found $($modules.Count)" }
          $module = $modules[0]
          if ($module.Length -eq 0) { throw "VST3 module is empty" }
          $bytes = [System.IO.File]::ReadAllBytes($module.FullName)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE/VST3 DLL" }
          $peOffset = [BitConverter]::ToInt32($bytes, 60)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw "Invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "VST3 DLL is not x64 (machine=$machine)" }
          $moduleInfoPath = Join-Path $resources "moduleinfo.json"
          if (-not (Test-Path $moduleInfoPath)) {
            throw "VST3 moduleinfo.json is missing"
          }
          $moduleInfo = Get-Content -Path $moduleInfoPath -Raw -Encoding utf8
          $moduleInfo = [regex]::Replace($moduleInfo, ',(?=\s*[}\]])', '')
          $parsedModuleInfo = ConvertFrom-Json -InputObject $moduleInfo -ErrorAction Stop
          if ($parsedModuleInfo.Name -ne "MIX AURA ALL-IN-ONE" -or $parsedModuleInfo.Classes.Count -lt 1) {
            throw "VST3 module metadata does not identify the Mix Aura plugin"
          }
          [System.IO.File]::WriteAllText($moduleInfoPath, $moduleInfo, [System.Text.UTF8Encoding]::new($false))
          $package = Join-Path $env:RUNNER_TEMP "MixAura_VST3_Windows_x64"
          $zip = Join-Path $env:RUNNER_TEMP "MixAura_VST3_Windows_x64.zip"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item $bundle.FullName (Join-Path $package "MIX AURA ALL-IN-ONE.vst3") -Recurse
          Copy-Item README.txt (Join-Path $package "INSTRUCOES.txt")
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -Force
          if (-not (Test-Path $zip -PathType Leaf) -or (Get-Item $zip).Length -lt 100KB) {
            throw "The generated ZIP is missing or unexpectedly small"
          }
          $zipSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "ZIP SHA-256: $zipSha256"
          "Generated ZIP: MixAura_VST3_Windows_x64.zip`nSHA-256: $zipSha256" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $verify = Join-Path $env:RUNNER_TEMP "MIX-AURA-VERIFY"
          Expand-Archive -Path $zip -DestinationPath $verify -Force
          $installedBundle = Join-Path $verify "MIX AURA ALL-IN-ONE.vst3"
          foreach ($relativePath in @("Contents/Resources/moduleinfo.json", "Contents/x86_64-win")) {
            if (-not (Test-Path (Join-Path $installedBundle $relativePath))) {
              throw "Extracted ZIP is missing required VST3 bundle content: $relativePath"
            }
          }
          $extractedMetadata = Get-Content -Path (Join-Path $installedBundle "Contents/Resources/moduleinfo.json") -Raw -Encoding utf8 |
            ConvertFrom-Json -ErrorAction Stop
          if ($extractedMetadata.Name -ne "MIX AURA ALL-IN-ONE") { throw "Extracted ZIP metadata is for the wrong plugin" }
          $extractedModules = @(Get-ChildItem -Path (Join-Path $installedBundle "Contents/x86_64-win") -Recurse -File |
            Where-Object { $_.Extension -in @(".dll", ".vst3") })
          if ($extractedModules.Count -ne 1) { throw "Extracted ZIP has an invalid VST3 module count" }
          $extractedBytes = [System.IO.File]::ReadAllBytes($extractedModules[0].FullName)
          if ($extractedBytes.Length -lt 64 -or $extractedBytes[0] -ne 0x4D -or $extractedBytes[1] -ne 0x5A) {
            throw "Extracted ZIP does not contain a valid PE module"
          }
          $extractedPeOffset = [BitConverter]::ToInt32($extractedBytes, 60)
          if ($extractedPeOffset -lt 0 -or $extractedPeOffset + 24 -gt $extractedBytes.Length -or
              $extractedBytes[$extractedPeOffset] -ne 0x50 -or $extractedBytes[$extractedPeOffset + 1] -ne 0x45 -or
              $extractedBytes[$extractedPeOffset + 2] -ne 0 -or $extractedBytes[$extractedPeOffset + 3] -ne 0 -or
              [BitConverter]::ToUInt16($extractedBytes, $extractedPeOffset + 4) -ne 0x8664) {
            throw "Extracted ZIP does not contain a valid Windows x64 PE module"
          }
          if (-not (Test-Path (Join-Path $verify "INSTRUCOES.txt"))) { throw "Installation instructions are missing" }

      - name: Upload Windows VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: MixAura_VST3_Windows_x64
          path: ${{ runner.temp }}/MixAura_VST3_Windows_x64.zip
          if-no-files-found: error
